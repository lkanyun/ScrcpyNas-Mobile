<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>分享与账号</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#1c1c1e;font:16px -apple-system,sans-serif}main{max-width:620px;margin:auto;padding:24px 20px 40px}a{color:#007aff;text-decoration:none}h1{font-size:28px;margin:24px 0}section{background:white;padding:20px;border-radius:22px;margin:18px 0}h2{font-size:19px;margin:0 0 12px}p{color:#737378;font-size:13px;line-height:1.6}label{display:block;margin:14px 0}input,select,button,textarea{font:inherit;width:100%;min-height:46px;border:1px solid #ddd;border-radius:12px;padding:11px;margin-top:6px}button{background:#007aff;color:white;border:0;cursor:pointer}button.secondary{background:#eee;color:#333}button.danger{background:#fff0f0;color:#d33}.share-item{border-top:1px solid #eee;margin-top:16px;padding-top:12px}.share-item button{width:auto;font-size:14px}#feedback{color:#1767ac}textarea{height:96px;resize:none;font-size:13px}#result[hidden]{display:none}</style><main><a href="/">‹ 我的设备</a><h1>分享与账号</h1><section><h2>只读分享</h2><p>持有链接的人可观看画面和声音，不能操作手机。关闭或到期后，正在观看的连接也会断开。</p><form id="create"><label>分享设备<select id="device" required></select></label><label>有效期<select id="duration"><option value="15">15 分钟</option><option value="60" selected>1 小时</option><option value="360">6 小时</option><option value="1440">1 天</option><option value="10080">7 天</option></select></label><button>生成观看链接</button></form><div id="result" hidden><p>链接只在本次生成后显示，请复制保存。</p><textarea id="link" readonly aria-label="观看链接"></textarea><button id="copy" class="secondary">复制链接</button></div><div id="shares"></div></section><section><h2>修改登录密码</h2><p>当前账号：<strong id="username">shun</strong>。修改后需用新密码重新登录；已生成的分享仍按原有效期生效。</p><form id="password"><label>当前密码<input type="password" name="currentPassword" autocomplete="current-password" required></label><label>新密码<input type="password" name="newPassword" autocomplete="new-password" minlength="6" maxlength="128" placeholder="至少 6 个字符，无需复杂组合" required></label><label>再次输入新密码<input type="password" name="confirm" autocomplete="new-password" required></label><button>保存新密码</button></form></section><p id="feedback" role="status"></p></main><script src="/manage.js"></script></html>
